<script>
/* 登录闸门（只做跳转，不判断你的登录逻辑；登录页在 /gate/ 下，自成一个前端）
   契约：登录/注册成功后由登录页写入
     localStorage['ds_gate'] = JSON.stringify({exp: 到期时间戳ms})   // 或字符串 '1'
   然后跳回 next 参数或 '/'。这里只读这个标记，读不到就去登录页。
   不会把自己锁死：只有 /gate/ 真的存在（HEAD 200）才跳。 */
(function () {
  try {
    var q = location.search || '';
    if (q.indexOf('reset=1') >= 0) return;                 // 救命开关永远放行
    if (location.pathname.indexOf('/gate/') === 0) return;  // 登录页自身放行
    var raw = null;
    try { raw = localStorage.getItem('ds_gate'); } catch (e) { raw = null; }
    var ok = false;
    if (raw) {
      try { var v = JSON.parse(raw); ok = !!v && (!v.exp || v.exp > Date.now()); }
      catch (e2) { ok = raw === '1' || raw === 'ok'; }
    }
    if (ok) { document.documentElement.setAttribute('data-gate', 'pass'); return; }
    document.documentElement.setAttribute('data-gate', 'block');
    fetch('/gate/', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      if (r && r.ok) {
        location.replace('/gate/?next=' + encodeURIComponent(location.pathname + q));
      }
    }).catch(function () {});
  } catch (e) {}
})();
</script>
